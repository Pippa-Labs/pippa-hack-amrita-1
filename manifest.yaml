manifest_version: 1
persistence: none

owner_email: 

app:
  id: hack.amrita_1
  name: Token Budget
  version: 0.1.0
  publisher: a builder
  summary: >-
    Calculates estimated AI token costs and compares savings from shorter
    inputs using usage figures and prices you supply. Sends no data to
    external services.

agent_types:
  - personal

outcomes:
  - id: tokens.compare
    summary: >-
      Calculate monthly AI token costs and savings from reducing input
      tokens per request.
    example_phrases:
      - calculate my monthly AI token cost
      - how much would reducing input tokens save
      - compare these two token budgets
      - estimate the cost of these AI requests
      - calculate savings from shorter AI prompts
      - work out my monthly token spending
      - calculate the annual savings from fewer input tokens
    inputs:
      - name: requests_per_month
        type: number
        required: false
        description: >-
          Monthly number of AI requests. Extract only a figure supplied
          by the user. Leave out if absent; never guess.
      - name: current_input_tokens
        type: number
        required: false
        description: >-
          Current average input tokens per request. Leave out if absent;
          never estimate from text or guess.
      - name: output_tokens
        type: number
        required: false
        description: >-
          Average output tokens per request, unchanged in both scenarios.
          Leave out if absent; never guess.
      - name: proposed_input_tokens
        type: number
        required: false
        description: >-
          Proposed average input tokens per request. For a cost-only
          question, leave out and the app will use the current input count.
          Otherwise extract the proposed count if supplied; never guess.
      - name: input_price_per_million
        type: number
        required: false
        description: >-
          Input price per one million tokens supplied by the user.
          Leave out if absent. Never infer a model price.
      - name: output_price_per_million
        type: number
        required: false
        description: >-
          Output price per one million tokens supplied by the user.
          Leave out if absent. Never infer a model price.
      - name: currency
        type: string
        required: false
        description: >-
          Currency explicitly supplied by the user, such as USD or GBP.
          Leave out if absent or ambiguous; never infer from location.

    output:
      - name: current_monthly_input_tokens
        type: integer
      - name: proposed_monthly_input_tokens
        type: integer
      - name: monthly_output_tokens
        type: integer
      - name: current_total_monthly_tokens
        type: integer
      - name: proposed_total_monthly_tokens
        type: integer
      - name: current_monthly_cost
        type: number
      - name: proposed_monthly_cost
        type: number
      - name: monthly_savings
        type: number
      - name: annualised_savings
        type: number
      - name: input_reduction_percent
        type: number
        required: false
      - name: total_token_reduction_percent
        type: number
        required: false
      - name: cost_reduction_percent
        type: number
        required: false
      - name: currency
        type: string
        required: false
      - name: assumptions
        type: string
